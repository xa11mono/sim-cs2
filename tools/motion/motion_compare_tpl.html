<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Движение: про и бот</title>
<style>
:root{--bg:#0f120e;--panel:#171c15;--line:rgba(255,255,255,.08);--text:#e6eadf;--dim:#8f9988;--accent:#a5c36a;--pro:#f0bd62;--bot:#8fc0ef}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0f120e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:16px;font-weight:600;margin:0 12px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{background:var(--accent);color:#10130e;border-color:var(--accent)}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 16px}
@media (max-width:760px){main{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pane h2{margin:0;padding:8px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.pane h2 span{color:var(--dim);font-weight:400}
canvas{display:block;width:100%;aspect-ratio:1/1;background:#000}
.hint{color:var(--dim);font-size:12px;padding:0 16px 16px}
</style></head><body>
<header><h1>__MAP__: движение точки и взгляда</h1>
<div class="seg" id="kinds"></div>
<div class="seg" id="speeds"></div>
<button id="next">Следующий кусок</button></header>
<main>
<div class="pane"><h2 style="color:var(--pro)">Про (демка) <span id="pi"></span></h2><canvas id="cp" width="720" height="720"></canvas></div>
<div class="pane"><h2 style="color:var(--bot)">Бот <span id="bi"></span></h2><canvas id="cb" width="720" height="720"></canvas></div>
</main>
<p class="hint">Каждый кусок — с 0,5 с до и после. Хвост — путь точки за кусок, черта — куда смотрит. Масштаб — по куску (у обоих одинаковый). Куски разные: сравнивается форма — как поворачивается взгляд и как ходит точка, а не место.</p>
<script>
const D=__DATA__, NAMES=__NAMES__, img=new Image(); img.src='data:image/png;base64,__IMG__';
let kind=Object.keys(D)[0], speed=1, idx=0, t=0, last=performance.now();
const K=document.getElementById('kinds'), S=document.getElementById('speeds');
Object.keys(D).forEach(k=>{const b=document.createElement('button');b.textContent=NAMES[k]||k;b.onclick=()=>{kind=k;idx=0;t=0;mark()};b.dataset.k=k;K.appendChild(b)});
[1,0.5,0.25].forEach(v=>{const b=document.createElement('button');b.textContent='×'+String(v).replace('.',',');b.onclick=()=>{speed=v;mark()};b.dataset.s=v;S.appendChild(b)});
document.getElementById('next').onclick=()=>{idx++;t=0};
function mark(){[...K.children].forEach(b=>b.classList.toggle('on',b.dataset.k===kind));[...S.children].forEach(b=>b.classList.toggle('on',+b.dataset.s===speed))}
mark();
function draw(cv,c,col,lab,zoom){
  const g=cv.getContext('2d'),W=cv.width; if(!c){g.fillStyle='#000';g.fillRect(0,0,W,W);return}
  const n=c.x.length, i=Math.min(n-1,Math.floor(t)), cx=c.x.reduce((a,b)=>a+b,0)/n, cy=c.y.reduce((a,b)=>a+b,0)/n;
  const k=W/zoom, X=v=>(v-cx)*k+W/2, Y=v=>(v-cy)*k+W/2;
  g.fillStyle='#000';g.fillRect(0,0,W,W);
  if(img.complete){const q=img.naturalWidth/2048; g.drawImage(img,(cx-zoom/2)*q,(cy-zoom/2)*q,zoom*q,zoom*q,0,0,W,W);}   // радар — картинка, координаты — 0..2048
  g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=1.5;g.beginPath();for(let j=0;j<n;j++){j?g.lineTo(X(c.x[j]),Y(c.y[j])):g.moveTo(X(c.x[j]),Y(c.y[j]))}g.stroke();
  const x=X(c.x[i]),y=Y(c.y[i]),a=c.f[i]*Math.PI/180,R=90*k,h=55*Math.PI/180;
  g.strokeStyle=col;g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*Math.max(26,22*k),y+Math.sin(a)*Math.max(26,22*k));g.stroke();   // взгляд — черта, без конуса (владелец 14.11)
  g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(4,6*k),0,7);g.fill();
  if(c.a[i]){g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(x,y,Math.max(7,10*k),0,7);g.stroke()}
  lab.textContent=(idx%Math.max(1,(D[kind][cv.id==='cp'?'pro':'bot']||[]).length)+1)+' / '+(D[kind][cv.id==='cp'?'pro':'bot']||[]).length+' · '+(i/64).toFixed(2)+' с';
}
function ext(c){if(!c)return 0;const xs=c.x,ys=c.y;return Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))}
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;t+=dt*64*speed;
  const P=D[kind].pro,B=D[kind].bot,p=P.length?P[idx%P.length]:null,b=B.length?B[idx%B.length]:null;
  const n=Math.max(p?p.x.length:0,b?b.x.length:0); if(t>n+32)t=0;
  const zoom=Math.max(160,ext(p)*1.6,ext(b)*1.6);
  draw(document.getElementById('cp'),p,'#f0bd62',document.getElementById('pi'),zoom);
  draw(document.getElementById('cb'),b,'#8fc0ef',document.getElementById('bi'),zoom);
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
