# Прогоны замера на ПК владельца (self-hosted runner). Задание — tools/measure/request.json в ветке measure/…
# Игру не меняет: собирает указанную в задании версию и играет матчи; результат — артефакт runs-<номер прогона>.
name: measure
on:
  push:
    branches: ['measure/**']
  workflow_dispatch:
concurrency:
  group: measure
  cancel-in-progress: false
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 600
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      # cmd, а не PowerShell: на Windows запуск скриптов PowerShell по умолчанию запрещён (шаг падал без вывода)
      - name: Play matches
        shell: cmd
        run: |
          python tools/measure/remote_run.py > run.log 2>&1
          set RC=%ERRORLEVEL%
          python -c "[print('::notice::'+l.rstrip()) for l in open('run.log',encoding='utf-8',errors='replace').readlines()[-8:]]"
          exit /b %RC%
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_number }}
          path: |
            tools/measure/runs/
            !tools/measure/runs/_sims/
          retention-days: 14
