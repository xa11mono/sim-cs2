<title>@@MAP_NAME@@ Live Radar</title>
<style>
  /* (v430) оформление страницы — одна система: цвета, радиусы, тени, движение — переменными (docs/DESIGN_SOURCES.md).
     Цвета команд прежние: те же, что у кружков игроков на радаре. Анимации — только transform / opacity (без пересчёта раскладки) */
  :root{
    color-scheme:dark;   /* (v430) тёмные списки выбора и полосы прокрутки браузера — как у страницы */
    --bg:#0c0f0b; --panel:#141912; --panel-2:#1b2118; --panel-3:#232a1f; --line:#283023; --line-2:#37412f;
    --accent:#b3cd63; --accent-dim:#5f7a32; --accent-ink:#10140b; --accent-soft:rgba(179,205,99,.14);
    --site:#d9832f; --mark:#e7c873; --mark-hi:#f3da92;
    --text:#e8ebe0; --text-dim:#98a28f; --text-mute:#6c7566; --ct:#5a9bd9; --t:#d9a24a; --danger:#e5594e;
    --ui:'Golos Text',system-ui,sans-serif; --num:'IBM Plex Mono',ui-monospace,monospace; --cond:'Roboto Condensed','Golos Text',sans-serif;
    --r-sm:5px; --r:8px; --r-lg:12px;
    --sh-1:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.35);
    --sh-pop:0 1px 0 rgba(255,255,255,.05) inset, 0 18px 40px -12px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.4);
    --ease:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.5,0,.75,0); --spring:cubic-bezier(.34,1.5,.64,1);
    --d1:120ms; --d2:180ms; --d3:280ms;
    --k:1;   /* масштаб HUD под ширину окна (635_hud_fx.js) */
    /* (v461) показ трансляции (повтор клатча 675, пауза 676) — общие: пузырь реплики, подсветка героя */
    --bubble:#fff; --bubble-ink:#0b0f0b; --bubble-quiet:rgba(255,255,255,.8); --bubble-dark:rgba(20,24,18,.92); --hero:var(--mark);
    /* иконки кнопок — маски (рисуются цветом текста; подписи кнопок скрипты меняют, иконки остаются) */
    --i-pause:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23000%22%3E%3Crect x=%226%22 y=%224.5%22 width=%224%22 height=%2215%22 rx=%221.2%22/%3E%3Crect x=%2214%22 y=%224.5%22 width=%224%22 height=%2215%22 rx=%221.2%22/%3E%3C/svg%3E");
    --i-play:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23000%22%3E%3Cpath d=%22M7 4.6v14.8a1 1 0 0 0 1.5.86l12.2-7.4a1 1 0 0 0 0-1.72L8.5 3.74A1 1 0 0 0 7 4.6z%22/%3E%3C/svg%3E");
    --i-back:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M3 12a9 9 0 1 0 3-6.7%22/%3E%3Cpath d=%22M3 4v5h5%22/%3E%3C/svg%3E");
    --i-restart:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M21 12a9 9 0 1 1-3-6.7%22/%3E%3Cpath d=%22M21 4v5h-5%22/%3E%3C/svg%3E");
    --i-snd:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M11 5 6 9H3v6h3l5 4z%22 fill=%22%23000%22/%3E%3Cpath d=%22M15.5 8.5a5 5 0 0 1 0 7%22/%3E%3Cpath d=%22M18.5 5.5a9 9 0 0 1 0 13%22/%3E%3C/svg%3E");
    --i-mute:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M11 5 6 9H3v6h3l5 4z%22 fill=%22%23000%22/%3E%3Cpath d=%22m16 9 5 6%22/%3E%3Cpath d=%22m21 9-5 6%22/%3E%3C/svg%3E");
    --i-obs:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%223%22 fill=%22%23000%22/%3E%3C/svg%3E");
    --i-map:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z%22/%3E%3Cpath d=%22M9 4v14%22/%3E%3Cpath d=%22M15 6v14%22/%3E%3C/svg%3E");
    --i-list:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M8 6h13%22/%3E%3Cpath d=%22M8 12h13%22/%3E%3Cpath d=%22M8 18h13%22/%3E%3Ccircle cx=%223.5%22 cy=%226%22 r=%22.6%22/%3E%3Ccircle cx=%223.5%22 cy=%2212%22 r=%22.6%22/%3E%3Ccircle cx=%223.5%22 cy=%2218%22 r=%22.6%22/%3E%3C/svg%3E");
    --i-flag:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M5 21V4%22/%3E%3Cpath d=%22M5 4h11l-2 4 2 4H5%22 fill=%22%23000%22/%3E%3C/svg%3E");
    --i-go:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23000%22%3E%3Cpath d=%22M7 4.6v14.8a1 1 0 0 0 1.5.86l12.2-7.4a1 1 0 0 0 0-1.72L8.5 3.74A1 1 0 0 0 7 4.6z%22/%3E%3C/svg%3E");
    --i-layers:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22m12 3 9 5-9 5-9-5z%22/%3E%3Cpath d=%22m3 13 9 5 9-5%22/%3E%3C/svg%3E");
    --i-tools:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z%22/%3E%3C/svg%3E");
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:13px;height:100%;overflow:hidden;font-feature-settings:'tnum';
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
  .mono{font-family:var(--num);}
  ::selection{background:var(--accent-soft);color:#fff;}
  /* тонкие полосы прокрутки во всех панелях */
  *{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background-color:var(--text-mute);}
  #app{display:flex;flex-direction:column;height:100%;}

  /* ---------- верхняя панель: кто мы | матч | вид и инструменты | отметки ---------- */
  #topbar{display:flex;align-items:center;gap:8px 12px;padding:7px 12px;flex-wrap:wrap;flex-shrink:0;position:relative;z-index:20;
    background:linear-gradient(180deg,#171c15 0%,#121610 100%);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.5);}
  .tb-id{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;margin-right:2px;}
  .tb-id::before{grid-row:1 / 3;}
  .tb-id h1,.tb-id .sub{grid-column:2;line-height:1.15;}
  .tb-id::before{content:"";width:10px;height:10px;flex:none;background:var(--accent);transform:rotate(45deg);border-radius:2px;
    box-shadow:0 0 0 3px var(--accent-soft);transition:background var(--d2) var(--ease),box-shadow var(--d2) var(--ease);}
  body:not(.is-paused) .tb-id::before{animation:tbLive 2.4s ease-in-out infinite;}
  body.is-paused .tb-id::before{background:var(--text-mute);box-shadow:0 0 0 3px rgba(255,255,255,.05);}
  @keyframes tbLive{0%,100%{box-shadow:0 0 0 3px var(--accent-soft);}50%{box-shadow:0 0 0 6px rgba(179,205,99,0);}}
  #topbar h1{font-family:var(--ui);font-size:15px;font-weight:600;letter-spacing:-.005em;margin:0;color:var(--text);white-space:nowrap;}
  #topbar .sub{color:var(--text-mute);font-size:10px;white-space:nowrap;font-family:var(--num);letter-spacing:-.01em;}
  .tb-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tb-right{margin-left:auto;}
  .tb-sep{width:1px;height:20px;background:var(--line);flex:none;}
  .tb-match{display:flex;align-items:center;gap:6px;padding:2px 2px 2px 9px;color:var(--text-dim);font-size:12px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);}
  .tb-match label.chk{font-size:12px;}
  #matchTick{font-size:10px;font-weight:400;color:var(--text-dim);font-family:var(--num);margin-left:8px;letter-spacing:-.01em;}
  /* сегментная группа: кнопки впритык, общая рамка */
  .seg{display:inline-flex;} .seg > button{border-radius:0;} .seg > button + button{margin-left:-1px;}
  .seg > button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);} .seg > button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0;}
  .seg > button.on{position:relative;z-index:1;}
  #matchTick:empty{display:none;}

  /* ---------- кнопки ---------- */
  button{font-family:inherit;font-size:12px;font-weight:500;color:var(--text);line-height:1.25;cursor:pointer;
    padding:5px 9px;border-radius:var(--r-sm);border:1px solid var(--line-2);
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0)) var(--panel-2);box-shadow:var(--sh-1);
    transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease),color var(--d1) var(--ease),transform var(--d1) var(--ease);
    -webkit-tap-highlight-color:transparent;user-select:none;}
  button:hover{background-color:var(--panel-3);border-color:#46513c;}
  button:active{transform:translateY(1px) scale(.98);transition-duration:60ms;}
  button:disabled{opacity:.45;cursor:default;transform:none;}
  /* включённый режим: лайм */
  button.active,button.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(179,205,99,.5);}
  button.active:hover,button.on:hover{background:rgba(179,205,99,.2);border-color:var(--accent);}
  /* кнопки с иконкой (по id: подписи и классы этих кнопок меняют скрипты — иконка живёт в ::before) */
  #btnPause,#btnBack10,#btnRestartRound,#btnFreshMatch,#btnSnd,#btnObs,#btnObsMap,#btnMarks,#btnMark,#btnWarmSkip,.dd > summary{display:inline-flex;align-items:center;gap:6px;}
  #btnPause::before,#btnBack10::before,#btnRestartRound::before,#btnFreshMatch::before,#btnSnd::before,#btnObs::before,#btnObsMap::before,
  #btnMarks::before,#btnMark::before,#btnWarmSkip::before,.dd > summary::before{content:"";width:13px;height:13px;flex:none;background:currentColor;
    -webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat;transition:transform var(--d2) var(--spring);}
  #btnPause{--ic:var(--i-pause);min-width:92px;} #btnPause.active{--ic:var(--i-play);}
  #btnBack10{--ic:var(--i-back);} #btnRestartRound{--ic:var(--i-restart);} #btnFreshMatch{--ic:var(--i-go);} #btnWarmSkip{--ic:var(--i-go);}
  #btnSnd{--ic:var(--i-mute);color:var(--text-dim);} #btnSnd.on{--ic:var(--i-snd);color:var(--accent);}
  #btnObs{--ic:var(--i-obs);} #btnObsMap{--ic:var(--i-map);} #btnMarks{--ic:var(--i-list);} #btnMark{--ic:var(--i-flag);}
  .dd:first-child > summary{--ic:var(--i-layers);} .dd + .dd > summary{--ic:var(--i-tools);}
  #btnBack10:hover::before{transform:rotate(-40deg);} #btnRestartRound:hover::before{transform:rotate(60deg);}
  #btnFreshMatch:hover::before,#btnWarmSkip:hover::before{transform:translateX(2px);} #btnMark:hover::before{transform:rotate(-8deg) scale(1.1);}
  /* главное действие: песочное золото */
  button.primary{background:linear-gradient(180deg,var(--mark-hi),var(--mark));color:#1f1806;border-color:#c9a94e;font-weight:600;
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 2px 8px -2px rgba(231,200,115,.35);}
  button.primary:hover{background:linear-gradient(180deg,#f8e4a6,var(--mark-hi));border-color:var(--mark);}
  button kbd{font:600 10px var(--num);margin-left:7px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);}
  button.primary kbd{background:rgba(31,24,6,.14);border-color:rgba(31,24,6,.18);}
  button.on kbd{background:rgba(179,205,99,.14);border-color:rgba(179,205,99,.25);}
  button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* (v425) громкость звуков — рядом с «Звук»: тонкая дорожка, заполнение — лайм (--v ставит 680) */
  /* ползунок всплывает под «Звук» при наведении / фокусе — места в строке не занимает */
  .snd-grp{position:relative;display:inline-flex;}
  .snd-pop{position:absolute;top:100%;left:50%;z-index:31;padding-top:6px;transform:translate(-50%,-4px);opacity:0;pointer-events:none;
    transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease);}
  .snd-pop::before{content:"";position:absolute;inset:6px 0 0;background:rgba(20,25,18,.98);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh-pop);}
  .snd-grp:hover .snd-pop,.snd-grp:focus-within .snd-pop{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  #sndVol{position:relative;-webkit-appearance:none;appearance:none;width:110px;height:16px;margin:9px 12px 8px;background:transparent;cursor:pointer;display:block;}
  #sndVol::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--v,85%),var(--line-2) var(--v,85%));}
  #sndVol::-moz-range-track{height:3px;border-radius:3px;background:var(--line-2);} #sndVol::-moz-range-progress{height:3px;border-radius:3px;background:var(--accent);}
  #sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4px;border-radius:50%;background:#eef3df;border:0;
    box-shadow:0 0 0 3px rgba(179,205,99,.18);transition:transform var(--d1) var(--spring);}
  #sndVol::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#eef3df;border:0;}
  #sndVol:hover::-webkit-slider-thumb{transform:scale(1.2);}
  #sndVol:focus{box-shadow:none;} #sndVol:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px;}

  /* узкое окно: второстепенные кнопки — только иконка (подсказка по наведению — title), чтобы панель шла одной строкой */
  @media (max-width:1780px){
    #btnSnd,#btnRestartRound,#btnObsMap{font-size:0;gap:0;padding-left:8px;padding-right:8px;}
  }
  @media (max-width:1500px){
    #btnBack10,#btnMarks,#btnFreshMatch{font-size:0;gap:0;padding-left:8px;padding-right:8px;}
    .tb-match label.chk{font-size:0;gap:0;}
  }

  /* ---------- поля ---------- */
  input[type=number],input[type=text],input:not([type]),select,textarea{font:inherit;font-size:12px;color:var(--text);background:#10140e;
    border:1px solid var(--line-2);border-radius:var(--r-sm);padding:4px 7px;transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease);}
  input[type=number],input[type=text],input:not([type]),select{height:26px;}
  input:hover,select:hover,textarea:hover{border-color:#46513c;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  input[type=number]{font-family:var(--num);}
  select{appearance:none;-webkit-appearance:none;padding-right:22px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);
    background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat;}
  #inpMatchNum{width:54px;}
  /* переключатели — «тумблер» вместо галочки */
  label.chk{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:12px;white-space:nowrap;cursor:pointer;transition:color var(--d1) var(--ease);}
  label.chk:hover{color:var(--text);}
  label.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:26px;height:15px;margin:0;border-radius:15px;cursor:pointer;
    background:#2b3326;border:1px solid var(--line-2);transition:background-color var(--d2) var(--ease),border-color var(--d2) var(--ease);}
  label.chk input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--text-dim);
    transition:transform var(--d2) var(--spring),background-color var(--d2) var(--ease);}
  label.chk input[type=checkbox]:checked{background:var(--accent-dim);border-color:var(--accent);}
  label.chk input[type=checkbox]:checked::after{transform:translateX(11px);background:#f4f8e6;}
  label.chk:has(input:checked){color:var(--text);}
  input[type=radio]{accent-color:var(--accent);}

  /* ---------- меню «Слои» и «Инструменты» ---------- */
  .dd{position:relative;}
  .dd > summary{list-style:none;font-size:12px;font-weight:500;color:var(--text);padding:5px 26px 5px 10px;cursor:pointer;user-select:none;position:relative;
    border-radius:var(--r-sm);border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0)) var(--panel-2);box-shadow:var(--sh-1);
    transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease);}
  .dd > summary:hover{background-color:var(--panel-3);border-color:#46513c;}
  .dd > summary::-webkit-details-marker{display:none;}
  .dd > summary::after{content:"";position:absolute;right:10px;top:50%;width:5px;height:5px;border-right:1.5px solid var(--text-dim);border-bottom:1.5px solid var(--text-dim);
    transform:translateY(-70%) rotate(45deg);transition:transform var(--d2) var(--ease);}
  .dd[open] > summary{background-color:var(--panel-3);border-color:var(--accent-dim);}
  .dd[open] > summary::after{transform:translateY(-25%) rotate(-135deg);}
  .dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;max-height:calc(100vh - 80px);overflow-y:auto;
    background:rgba(20,25,18,.98);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;
    box-shadow:var(--sh-pop);z-index:30;transform-origin:top left;}
  .dd[open] .dd-menu{animation:ddIn var(--d2) var(--ease);}
  .dd-menu.dd-r{left:auto;right:0;transform-origin:top right;}
  @keyframes ddIn{from{opacity:0;transform:translateY(-4px) scale(.98);}to{opacity:1;transform:none;}}
  .dd-h{font-size:11px;color:var(--text-mute);margin-top:8px;padding-top:9px;border-top:1px solid var(--line);font-weight:500;}
  .dd-h:first-child{margin-top:0;padding-top:0;border-top:0;}
  .dd-h:last-child:empty,.dd-h:last-child{display:none;}
