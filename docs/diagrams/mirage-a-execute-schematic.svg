<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Схема планирования выхода T на Mirage A через Ramp</title><desc id="desc">Условная, не в масштабе схема с маршрутом атаки и возможными направлениями угроз. Не является точной геометрической картой и не заменяет проверенные лайнапы.</desc>
<rect width="1200" height="720" rx="22" fill="#f8fafc"/><text x="55" y="60" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Пример: командный выход на A через Ramp</text><text x="55" y="95" font-family="Arial,sans-serif" font-size="18" fill="#475569">Схема логики, НЕ геометрическая карта и НЕ готовый набор лайнапов</text>
<g font-family="Arial,sans-serif">
<path d="M90 540 L390 540 L450 480 L720 480 L800 420 L1080 420" fill="none" stroke="#94a3b8" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><rect x="760" y="180" width="340" height="420" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="930" y="220" font-size="26" font-weight="700" fill="#1d4ed8" text-anchor="middle">A SITE</text>
<rect x="130" y="485" width="180" height="100" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="220" y="525" text-anchor="middle" font-size="23" font-weight="700" fill="#92400e">T Ramp</text><text x="220" y="553" text-anchor="middle" font-size="15" fill="#92400e">старт группы</text>
<rect x="480" y="425" width="140" height="105" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="550" y="465" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">Tetris</text><text x="550" y="492" text-anchor="middle" font-size="14" fill="#334155">укрытие</text>
<rect x="820" y="275" width="130" height="80" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="885" y="309" text-anchor="middle" font-size="19" font-weight="700" fill="#991b1b">Ticket</text><text x="885" y="333" text-anchor="middle" font-size="14" fill="#991b1b">пример цели</text>
<rect x="970" y="275" width="130" height="80" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="1035" y="309" text-anchor="middle" font-size="19" font-weight="700" fill="#991b1b">Jungle</text><text x="1035" y="333" text-anchor="middle" font-size="14" fill="#991b1b">пример цели</text>
<rect x="830" y="470" width="120" height="80" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="890" y="505" text-anchor="middle" font-size="19" font-weight="700" fill="#991b1b">Stairs</text><text x="890" y="529" text-anchor="middle" font-size="14" fill="#991b1b">пример цели</text>
<path d="M310 535 L475 477 L760 450" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/><path d="M748 437 L770 450 L746 464" fill="none" stroke="#16a34a" stroke-width="6"/>
<path d="M610 430 Q700 310 820 315" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="12 8"/><path d="M800 302 L825 315 L802 328" fill="none" stroke="#2563eb" stroke-width="4"/><text x="660" y="290" font-size="17" fill="#1d4ed8">задача смока</text>
<path d="M620 490 Q720 540 830 520" fill="none" stroke="#9333ea" stroke-width="5" stroke-dasharray="8 7"/><text x="650" y="570" font-size="17" fill="#6b21a8">флеш/молотов — только если нужны</text>
<text x="95" y="640" font-size="18" fill="#334155">Правило: сначала выбрать опасные линии для конкретного выхода, затем назначить цель/исполнителя/тайминг.</text><text x="95" y="670" font-size="18" fill="#334155">Не бросать «на всякий случай»; проверить эффект и продолжить выход по подтверждённому окну.</text>
</g></svg>
