# (Б4) Выгрузка из демок про на ПК владельца: все выстрелы со скоростью и весь урон (tools/demo_events_pc.py). Игру не меняет.
# Задание — tools/demo_events_request.json в ветке demos/…; результат — ветка pc-demos/<номер прогона> (пути как в репо).
name: demos
on:
  push:
    branches: ['demos/**']
  workflow_dispatch:
concurrency:
  group: measure
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 600
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Parse demos
        shell: cmd
        run: |
          python tools/demo_events_pc.py
          set RC=%ERRORLEVEL%
          python -c "[print('::notice::'+l.rstrip()) for l in open(__import__('os').path.expanduser('~/simcs2_run.log'),encoding='utf-8',errors='replace').readlines()[-8:]]"
          exit /b %RC%
      - name: Publish results
        if: always()
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/demo_events_pc.py --publish
