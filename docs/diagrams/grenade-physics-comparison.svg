<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Сравнение упрощённой и физической траектории гранаты</title><desc id="desc">Слева условный ошибочный расчёт с прямым движением и 2D-отражением; справа единая 3D-траектория с гравитацией, столкновением с поверхностью и отражением по нормали.</desc>
<rect width="1200" height="700" rx="22" fill="#f8fafc"/><text x="55" y="60" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Гранаты: разрозненные модели против единой физики</text>
<g font-family="Arial,sans-serif">
<rect x="45" y="95" width="535" height="535" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/><text x="75" y="137" font-size="24" font-weight="700" fill="#9f1239">Неправильная архитектура</text>
<rect x="80" y="475" width="450" height="22" fill="#64748b"/><rect x="375" y="220" width="24" height="255" fill="#64748b"/><rect x="275" y="185" width="255" height="20" fill="#64748b"/><text x="400" y="176" font-size="16" fill="#475569">крыша/навес</text>
<path d="M110 410 L495 410" stroke="#dc2626" stroke-width="5" stroke-dasharray="10 8" fill="none"/><circle cx="110" cy="410" r="11" fill="#dc2626"/><circle cx="382" cy="410" r="12" fill="#dc2626"/><path d="M382 410 L382 320 L474 320" stroke="#dc2626" stroke-width="5" fill="none"/><path d="M470 310 L484 320 L470 330" fill="none" stroke="#dc2626" stroke-width="4"/><text x="125" y="390" font-size="16" fill="#991b1b">линейный X/Y полёт</text><text x="394" y="350" font-size="16" fill="#991b1b">ложный контакт</text><text x="95" y="535" font-size="17" fill="#881337">• высота не участвует в реальном контакте</text><text x="95" y="565" font-size="17" fill="#881337">• столкновение с клеткой вместо поверхности</text><text x="95" y="595" font-size="17" fill="#881337">• новое направление может быть произвольным</text>
<rect x="620" y="95" width="535" height="535" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text x="650" y="137" font-size="24" font-weight="700" fill="#166534">Требуемая архитектура</text>
<rect x="655" y="475" width="450" height="22" fill="#64748b"/><rect x="950" y="220" width="24" height="255" fill="#64748b"/><rect x="850" y="185" width="255" height="20" fill="#64748b"/><text x="980" y="176" font-size="16" fill="#475569">крыша/навес</text>
<path d="M680 430 Q765 225 850 280 Q900 315 936 458 Q954 485 1010 448 Q1055 422 1080 410" stroke="#16a34a" stroke-width="5" fill="none"/><circle cx="680" cy="430" r="11" fill="#16a34a"/><circle cx="936" cy="458" r="12" fill="#f59e0b"/><path d="M930 432 L936 458 L960 440" stroke="#166534" stroke-width="3" fill="none"/><text x="700" y="235" font-size="16" fill="#166534">3D движение + гравитация</text><text x="870" y="525" font-size="16" fill="#166534">контакт по нормали</text><text x="670" y="555" font-size="17" fill="#14532d">• одна траектория для физики и визуализации</text><text x="670" y="585" font-size="17" fill="#14532d">• swept-volume collision с геометрией</text><text x="670" y="615" font-size="17" fill="#14532d">• отскок с учётом нормали и трения</text>
</g></svg>
