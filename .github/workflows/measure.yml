# Прогоны замера на ПК владельца (self-hosted runner). Задание — tools/measure/request.json в ветке measure/…
# Игру не меняет: собирает указанную в задании версию и играет матчи; результат — артефакт runs-<номер прогона>.
name: measure
on:
  push:
    branches: ['measure/**']
  workflow_dispatch:
concurrency:
  group: measure
  cancel-in-progress: false
jobs:
  run:
    runs-on: self-hosted
    timeout-minutes: 600
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'; $miss = 0
          foreach($c in 'node','npm','python','git'){
            try { $v = (& $c --version 2>&1 | Out-String).Trim(); Write-Output "::notice::$c $v" }
            catch { Write-Output "::error::$c НЕ НАЙДЕН"; $miss = 1 } }
          if($miss){ exit 1 }
      - name: Play matches
        shell: powershell
        run: |
          python tools/measure/remote_run.py *> run.log
          $ok = $? -and ($LASTEXITCODE -eq 0)
          Get-Content run.log -Tail 20 | ForEach-Object { Write-Output "::notice::$_" }
          if(-not $ok){ exit 1 }
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_number }}
          path: |
            tools/measure/runs/
            !tools/measure/runs/_sims/
          retention-days: 14
