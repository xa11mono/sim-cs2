<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Командное исполнение гранат</title><desc id="desc">План выхода назначает задания, координатор распределяет исполнителей и гранаты, проверяет тайминги, синхронизирует броски с движением и сверяет эффект.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="760" rx="24" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Командное исполнение гранат</text>
<text x="60" y="100" font-family="Arial,sans-serif" font-size="18" fill="#475569">Схема архитектуры · концепт, не текущая реализация</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="145" width="290" height="120" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="215" y="184" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">1. Тактический план</text><text x="215" y="216" text-anchor="middle" font-size="16" fill="#1e40af">Маршрут, цель, опасные углы</text><text x="215" y="240" text-anchor="middle" font-size="16" fill="#1e40af">обязательные эффекты</text>
<rect x="455" y="145" width="290" height="120" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="600" y="184" text-anchor="middle" font-size="22" font-weight="700" fill="#4c1d95">2. Координатор</text><text x="600" y="216" text-anchor="middle" font-size="16" fill="#5b21b6">Исполнитель, инвентарь, drop/pickup</text><text x="600" y="240" text-anchor="middle" font-size="16" fill="#5b21b6">время и запасной вариант</text>
<rect x="840" y="145" width="290" height="120" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="985" y="184" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">3. Исполнение</text><text x="985" y="216" text-anchor="middle" font-size="16" fill="#166534">Дойти, бросить, дождаться</text><text x="985" y="240" text-anchor="middle" font-size="16" fill="#166534">фактического события</text>
<path d="M360 205 H445" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M745 205 H830" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="240" y="355" width="310" height="125" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="395" y="395" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">4. Синхронизация</text><text x="395" y="427" text-anchor="middle" font-size="16" fill="#9a3412">Флеш-поп → окно пика</text><text x="395" y="451" text-anchor="middle" font-size="16" fill="#9a3412">entry → размен → контроль</text>
<rect x="650" y="355" width="310" height="125" rx="16" fill="#fce7f3" stroke="#f472b6" stroke-width="2"/><text x="805" y="395" text-anchor="middle" font-size="22" font-weight="700" fill="#9d174d">5. Проверка результата</text><text x="805" y="427" text-anchor="middle" font-size="16" fill="#9d174d">Попала ли граната в нужную зону?</text><text x="805" y="451" text-anchor="middle" font-size="16" fill="#9d174d">Был ли эффект? Что делать дальше?</text>
<path d="M985 265 V315 H805 V345" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M650 417 H560" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M395 355 V305 H215 V275" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
<rect x="210" y="545" width="780" height="125" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="600" y="585" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Обратная связь и отмена</text><text x="600" y="618" text-anchor="middle" font-size="17" fill="#334155">Смерть исполнителя · потеря маршрута · неверная точка · фейк · новая информация</text><text x="600" y="644" text-anchor="middle" font-size="17" fill="#334155">Задание отменяется или переназначается; команда не выполняет устаревший план вслепую.</text>
<path d="M805 480 V515 H600 V535" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 545 V520 H395 V490" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</g></svg>
