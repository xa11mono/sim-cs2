<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}  .med{position:absolute;top:10px;right:12px;width:300px;background:rgba(10,14,9,0.94);border:1px solid var(--accent-dim);padding:10px 12px;border-radius:6px;font-size:12px;line-height:1.5;z-index:6;}
  .med-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;color:var(--accent);}
  .med-tabs button{font-size:11px;padding:2px 8px;margin-left:4px;}

  .med-tools button.on{background:var(--accent);color:#0a0e09;border-color:var(--accent);}

  .med-hint ul{margin:4px 0 0;padding-left:16px;} .med-hint li{margin:1px 0;}
  .med-info{font-size:11px;color:var(--text-dim);margin-bottom:8px;}
  .med-row{display:flex;gap:6px;margin-bottom:6px;} .med-row button{flex:1;font-size:11px;padding:4px 6px;}
  .med-save{font-size:11px;color:var(--text-dim);}
  .med-save.warn{color:#ffd76a;} .med-save.ok{color:var(--accent);}
  .hgt-tip{position:absolute;z-index:7;pointer-events:none;background:rgba(10,14,9,0.94);border:1px solid var(--accent-dim);border-radius:5px;padding:5px 8px;font-size:11.5px;line-height:1.45;color:var(--text);white-space:nowrap;}
  .hgt-tip b{color:var(--accent);font-weight:600;}
  .wb-tip{white-space:normal;width:400px;} .med-sel{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-size:11px;}
  .med-lv{display:flex;gap:4px;align-items:center;margin-bottom:6px;flex-wrap:wrap;} .med-lv button{font-size:11px;padding:3px 9px;} .med-lv button.on{background:var(--accent);color:#0a0e09;border-color:var(--accent);}
  .med-lv input{width:52px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 5px;}
  /* табло как на трансляции (Н6): плоское, без «рваной бумаги» */
  /* (v269) HUD по образцу трансляции ESL, по правилам docs/DESIGN_SOURCES.md: плотность «кокпит», острые углы, числа моно,
     иерархия весом и цветом; цвета команд — данные; номера = номера в кружках радара */
  :root{--hud-f:'Roboto Condensed','Golos Text',sans-serif; --hud-n:'IBM Plex Mono',ui-monospace,monospace; --hud-ink:#121510;
        --hud-row:rgba(18,22,16,.9); --hud-row-sel:rgba(40,46,36,.95); --hud-dim:#8d9786; --hud-line:rgba(255,255,255,.07); --hud-money:#9fbf6a;}
  #scoreboard{position:absolute;top:8px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:4;font-family:var(--hud-f);display:flex;flex-direction:column;align-items:stretch;}
  #scoreboard .sb-head{display:flex;justify-content:space-between;}
  #scoreboard .sb-head span{background:var(--accent);color:var(--hud-ink);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:2px 10px 1px;line-height:1.3;}
  #lookDbg{position:fixed;left:12px;top:390px;z-index:60;width:380px;max-height:calc(100vh - 402px);overflow:auto;background:#121610;border:1px solid var(--hud-line);
    color:#d9dfd3;font:400 11px/1.35 var(--hud-f);padding:0;display:none;}
  #lookDbg .ld-h{padding:6px 8px;border-bottom:1px solid var(--hud-line);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:11px;}
  #lookDbg .ld-s{padding:5px 8px;border-bottom:1px solid var(--hud-line);}
  #lookDbg .ld-k{color:var(--hud-dim);text-transform:uppercase;letter-spacing:.05em;font-size:10px;margin-bottom:2px;}
  #lookDbg .ld-n{font-family:var(--hud-n);font-variant-numeric:tabular-nums;}
  #lookDbg table{border-collapse:collapse;width:100%;}
  #lookDbg td{padding:1px 4px 1px 0;vertical-align:top;border-top:1px solid var(--hud-line);}
  #lookDbg tr.pick td{color:#fff;} #lookDbg tr.pick td:first-child{box-shadow:inset 2px 0 0 #e8dc5a;padding-left:4px;}
  #lookDbg .ld-f{color:var(--hud-dim);font-size:10px;}
  /* (v307) мини-радар: вся карта, игроки точками с номером, бомба */
  #miniMap{position:absolute;left:auto;right:12px;top:340px;cursor:default;width:232px;height:232px;z-index:5;background:rgba(10,13,9,.45);border:none;border-radius:4px;pointer-events:none;}
  #btnObs.on,#btnObsMap.on{background:var(--accent);color:#0a0e09;border-color:var(--accent);}
  /* (v304) серия BO3/BO5: квадраты карт под табло, закрашивает победитель карты */
  #scoreboard .sb-series{display:flex;justify-content:space-between;padding:3px 6px 0;}
  #scoreboard .sb-series span{display:flex;gap:4px;} #scoreboard #sbSerCT{flex-direction:row-reverse;}
  #scoreboard .sb-series i{display:block;width:12px;height:12px;border:1px solid var(--hud-line);background:var(--hud-row);}
  #scoreboard #sbSerT i.w{background:var(--t);border-color:var(--t);} #scoreboard #sbSerCT i.w{background:var(--ct);border-color:var(--ct);}
  #scoreboard .sb-main{display:flex;align-items:stretch;background:var(--hud-row);border-bottom:1px solid var(--hud-line);}
  #scoreboard .sb-team{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:2px solid transparent;}
  #scoreboard .sb-team.t{border-top-color:var(--t);} #scoreboard .sb-team.ct{border-top-color:var(--ct);flex-direction:row-reverse;}
  #scoreboard .sb-logo{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;overflow:hidden;border:1px solid var(--hud-line);}
  #scoreboard .sb-logo img{width:90%;height:90%;object-fit:contain;}
  #scoreboard .t .sb-logo{color:var(--t);} #scoreboard .ct .sb-logo{color:var(--ct);}
  #scoreboard .sb-name{font-family:'Roboto Condensed','Golos Text',sans-serif;font-size:12px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--hud-dim);max-width:124px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #scoreboard .sb-score{font-family:var(--hud-n);font-size:28px;font-weight:500;color:#fff;min-width:26px;text-align:center;line-height:1;}
  #scoreboard .sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 14px;min-width:80px;border-left:1px solid var(--hud-line);border-right:1px solid var(--hud-line);}
  #scoreboard .sb-round{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--hud-dim);text-transform:uppercase;line-height:1.1;}
  #scoreboard .sb-time{font-family:var(--hud-n);font-size:17px;font-weight:500;color:#fff;line-height:1.1;}
  #scoreboard .sb-time.low{color:#ff8a7e;} #scoreboard .sb-time.bomb{color:#ff5a4c;}
  #scoreboard .sb-alive{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;font-size:11px;color:var(--hud-dim);}
  #scoreboard .sb-alive b{font-family:var(--hud-n);min-width:20px;padding:0 5px;text-align:center;font-size:13px;font-weight:500;color:var(--hud-ink);}
  #scoreboard .sb-alive b.t{background:var(--t);} #scoreboard .sb-alive b.ct{background:var(--ct);}
  /* панели игроков: строки без зазоров, разделены линией 1 px */
  .pl-col{position:absolute;top:10px;width:330px;display:flex;flex-direction:column;pointer-events:none;z-index:3;font-family:var(--hud-f);color:#fff;}
  #plT{left:12px;} #plCT{right:12px;}
  .pl-tag{display:flex;align-items:center;height:28px;padding:0 12px;font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;background:var(--hud-row);border-top:2px solid;}
  #plT .pl-tag{border-color:var(--t);color:var(--t);} #plCT .pl-tag{border-color:var(--ct);color:var(--ct);justify-content:flex-end;}
  .pl-card{position:relative;display:flex;align-items:stretch;height:58px;background:var(--hud-row);border-top:1px solid var(--hud-line);pointer-events:auto;cursor:pointer;}
  .pl-card:hover{background:var(--hud-row-sel);}
  #plCT .pl-card{flex-direction:row-reverse;}
  .pl-num{flex:none;width:22px;display:flex;align-items:center;justify-content:center;font-family:var(--hud-n);font-size:14px;font-weight:500;color:var(--hud-ink);}
  #plT .pl-num{background:var(--t);} #plCT .pl-num{background:var(--ct);}
  .pl-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 11px;}
  #plCT .pl-body{align-items:flex-end;}
  .pl-nick{font-size:17px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .pl-stat{display:flex;align-items:center;gap:10px;font-family:var(--hud-n);font-size:13px;color:var(--hud-dim);line-height:1;}
  .pl-stat svg{width:11px;height:11px;fill:var(--hud-dim);margin-right:3px;vertical-align:-1px;}
  .pl-money{color:var(--hud-money);}
  .pl-ava{flex:none;width:54px;align-self:flex-end;height:56px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
  .pl-ava svg{width:40px;height:40px;fill:rgba(255,255,255,.16);} .pl-ava img{width:100%;height:100%;object-fit:cover;}
  .pl-side{flex:none;width:86px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;padding:0 11px 0 4px;}
  #plCT .pl-side{align-items:flex-start;padding:0 4px 0 11px;}
  .pl-top{display:flex;align-items:center;gap:6px;} #plCT .pl-top{flex-direction:row-reverse;}
  .pl-top svg.wp{height:13px;width:auto;max-width:44px;fill:#fff;opacity:.55;} #plCT .pl-top svg.wp{transform:scaleX(-1);}
  .pl-hp{font-family:var(--hud-n);font-size:22px;font-weight:500;line-height:1;}
  .pl-hp.low{color:#ff8a7e;}
  .pl-gear{display:flex;align-items:center;gap:4px;height:12px;}
  /* (v322, М28) купил / подобрал — иконка появляется: 220 мс, ease-out (DESIGN_SOURCES: движение только в ответ на действие, до 300 мс) */
  .pl-it{display:inline-flex;align-items:center;flex:none;} .pl-it.new{animation:plItIn 220ms cubic-bezier(.2,.8,.2,1) both;}
  @keyframes plItIn{from{opacity:0;transform:translateY(-5px) scale(.6);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .pl-it.new{animation:none;} }
  .pl-gear svg{height:11px;width:auto;fill:rgba(255,255,255,.45);flex:none;} .pl-gear svg.kf{height:13px;opacity:.6;}
  .pl-bar{position:absolute;left:22px;right:0;bottom:0;height:3px;}
  #plCT .pl-bar{left:0;right:22px;}
  .pl-bar b{display:block;height:100%;opacity:.75;} #plT .pl-bar b{background:var(--t);} #plCT .pl-bar b{background:var(--ct);margin-left:auto;}
  .pl-bar b.low{background:var(--danger)!important;opacity:1;}
  #plT .pl-card.dead .pl-num,#plCT .pl-card.dead .pl-num{background:#3a3e36;color:#8d9786;} .pl-card.dead .pl-nick{color:#6f776a;} .pl-card.dead .pl-ava{opacity:.4;} .pl-card.dead .pl-hp{color:#6f776a;font-size:17px;}
  .pl-card.sel{background:var(--hud-row-sel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);}
  .pl-card:focus-visible{outline:1px solid #fff;outline-offset:-1px;}
  /* выбранный игрок: портрет, фраги | смерти, ник и HP; появление — 180 мс */
  #plFocus{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;flex-direction:column;width:200px;pointer-events:none;z-index:4;font-family:var(--hud-f);}
  #plFocus.show{display:flex;animation:pfIn .18s cubic-bezier(.2,.8,.2,1);}
  @keyframes pfIn{from{opacity:0;transform:translate(-50%,6px);}to{opacity:1;transform:translate(-50%,0);}}
  @media (prefers-reduced-motion: reduce){ #plFocus.show{animation:none;} }
  #plFocus .pf-photo{position:relative;height:116px;display:flex;align-items:flex-end;justify-content:center;overflow:visible;}
  /* (v303, владелец 14.10) квадрат под фото «строится» снизу вверх, фото выезжает и выходит за рамку сверху (как карточка игрока в HUD) */
  #plFocus .pf-photo::before{content:"";position:absolute;inset:0;background:#1b2018;border-top:2px solid var(--ct);transform-origin:50% 100%;}
  #plFocus.t .pf-photo::before{border-top-color:var(--t);}
  #plFocus.pop .pf-photo::before{animation:pfBox .24s cubic-bezier(.2,.8,.2,1) both;}
  #plFocus #pfPhoto{position:absolute;left:50%;bottom:0;width:168px;height:168px;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;z-index:1;}
  #plFocus.pop #pfPhoto{animation:pfRise .34s cubic-bezier(.2,.8,.2,1) .1s both;}
  @keyframes pfBox{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes pfRise{from{opacity:0;transform:translate(-50%,22px);}to{opacity:1;transform:translate(-50%,0);}}
  @media (prefers-reduced-motion: reduce){ #plFocus.pop .pf-photo::before, #plFocus.pop #pfPhoto{animation:none;} }
    #plFocus .pf-photo svg{width:100px;height:100px;fill:rgba(255,255,255,.14);} #plFocus .pf-photo img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;}
  #plFocus .pf-kd{position:absolute;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:6px;padding:2px 8px;background:var(--hud-ink);font-family:var(--hud-n);font-size:12px;color:#fff;}
  #plFocus .pf-kd i{width:1px;height:10px;background:var(--hud-dim);}
  #plFocus .pf-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:30px;padding:0 10px;background:var(--hud-ink);border-top:1px solid var(--hud-line);}
  #plFocus #pfNick{font-size:15px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#fff;}
  #plFocus #pfHp{font-family:var(--hud-n);font-size:16px;font-weight:500;color:#fff;}
</style></head><body>
